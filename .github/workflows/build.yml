name: Build App
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install and Build
        run: |
          npm install
          CI=false npm run build
      - name: Save App Build
        uses: actions/upload-artifact@v4
        with:
          name: lumina-dist
          path: build/
